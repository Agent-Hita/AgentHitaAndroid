name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Hita Safety SDK
        uses: actions/checkout@v4
        with:
          repository: Agent-Hita/HitaSafetySDK
          # settings.gradle.kts includes this build via a relative path
          # ("../HitaSafetySDK"), so it must land as a sibling of this
          # checkout, not nested inside it.
          path: ../HitaSafetySDK

      - name: Set up secrets.properties
        run: |
          cp secrets.properties.example secrets.properties
          sed -i 's|^KEYSTORE_FILE=.*|KEYSTORE_FILE=|' secrets.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 14

  require-dev-source:
    name: Require dev as PR source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Verify PR source branch is dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "PRs into main must come from the 'dev' branch (got '${{ github.head_ref }}')."
            exit 1
          fi
